<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Groupmate 控制中心</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">GROUPMATE</p>
          <h1>控制中心</h1>
        </div>
        <div class="top-actions">
          <span id="runtime-badge" class="status-badge" data-tone="neutral">读取中</span>
          <button id="refresh-button" class="button button-quiet" type="button">刷新</button>
          <button id="pause-button" class="button button-primary" type="button" hidden>暂停观察</button>
        </div>
      </header>

      <nav class="tabbar" aria-label="Groupmate 页面">
        <button class="tab is-active" data-view="overview" type="button">概览</button>
        <button class="tab" data-view="review" type="button">审阅</button>
      </nav>

      <main class="content">
        <div id="error-banner" class="notice notice-error" role="alert" hidden></div>
        <div id="live-status" class="sr-only" aria-live="polite"></div>

        <section id="overview-view" data-view-panel="overview">
          <div class="section-heading">
            <div>
              <p class="eyebrow">运行概览</p>
              <h2>先确认状态，再处理判断</h2>
            </div>
            <p id="updated-at" class="muted">等待数据</p>
          </div>

          <section class="status-strip" aria-label="运行状态">
            <div class="status-item">
              <span class="status-dot" data-status-dot></span>
              <div><span class="muted">运行状态</span><strong id="runtime-text">读取中</strong></div>
            </div>
            <div class="status-item"><div><span class="muted">模式</span><strong id="mode-text">读取中</strong></div></div>
            <div class="status-item"><div><span class="muted">已初始化群</span><strong id="group-count">-</strong></div></div>
            <div class="status-item status-action"><button id="runtime-action" class="button button-secondary" type="button">-</button></div>
          </section>

          <section class="review-callout" aria-labelledby="pending-title">
            <div>
              <p class="eyebrow">下一步</p>
              <h2 id="pending-title"><span id="pending-count">-</span> 条影子决策待标注</h2>
              <p id="pending-description" class="muted">标注结果会进入本地评测集，原始模型判断不会被修改。</p>
            </div>
            <button id="review-pending" class="button button-primary" type="button">开始审阅</button>
          </section>

          <div class="overview-grid">
            <section class="section-block" aria-labelledby="recent-title">
              <div class="section-heading compact"><h2 id="recent-title">最近待处理</h2><button id="open-review" class="text-button" type="button">查看全部</button></div>
              <div id="recent-list" class="decision-list"><div class="loading-row">正在加载...</div></div>
            </section>
            <section class="section-block" aria-labelledby="summary-title">
              <div class="section-heading compact"><h2 id="summary-title">运行摘要</h2><span id="sample-note" class="muted">-</span></div>
              <div id="summary-list" class="summary-list"><div class="loading-row">正在加载...</div></div>
              <p id="policy-note" class="muted policy-note"></p>
            </section>
          </div>

          <section class="section-block export-block" aria-labelledby="export-title">
            <div><h2 id="export-title">评测数据</h2><p class="muted">只导出已标注且已脱敏的影子记录。</p></div>
            <button id="export-button" class="button button-secondary" type="button">下载评测集</button>
          </section>
        </section>

        <section id="review-view" data-view-panel="review" hidden>
          <div class="section-heading">
            <div><p class="eyebrow">人工审阅</p><h2>影子决策队列</h2></div>
            <button id="review-refresh" class="button button-quiet" type="button">刷新列表</button>
          </div>

          <div class="filterbar" role="group" aria-label="筛选影子决策">
            <label>标签<select id="label-filter" class="select"><option value="unlabeled">未标注</option><option value="all">全部</option><option value="must_respond">必须回复</option><option value="may_respond">可以回复</option><option value="must_silence">必须沉默</option><option value="skipped">跳过</option></select></label>
            <label>动作<select id="action-filter" class="select"><option value="all">全部</option><option value="respond">回复</option><option value="ignore">沉默</option><option value="bypass">旁路</option></select></label>
            <span id="review-count" class="muted filter-count"></span>
          </div>

          <div class="review-layout">
            <section class="section-block review-queue" aria-labelledby="queue-title">
              <div class="section-heading compact"><h2 id="queue-title">决策列表</h2><button id="load-more" class="text-button" type="button" hidden>加载更多</button></div>
              <div id="decision-list" class="decision-list"><div class="loading-row">正在加载...</div></div>
            </section>
            <aside id="decision-detail" class="detail-panel" aria-labelledby="detail-title">
              <div class="detail-empty"><span class="detail-icon">↗</span><h2>选择一条决策</h2><p class="muted">从左侧列表打开详情后，可以给模型判断添加人工标签。</p></div>
            </aside>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
