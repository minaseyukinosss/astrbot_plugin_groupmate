<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Groupmate · 运行中心</title>
    <link rel="stylesheet" href="./styles/tokens.css">
    <link rel="stylesheet" href="./styles/layout.css">
    <link rel="stylesheet" href="./styles/components.css">
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    <div class="app-shell" id="app-shell">
      <aside class="sidebar" aria-label="Groupmate 群聊伙伴导航">
        <div class="brand-block">
          <img class="brand-mark" src="./assets/groupmate-bot.png" alt="">
          <div class="brand-copy">
            <strong>Groupmate</strong>
            <span><i class="system-indicator" aria-hidden="true"></i><b id="system-status">正在连接</b></span>
          </div>
        </div>

        <nav aria-label="主要工作区">
          <a href="#/runtime" data-route="/runtime">
            <img class="nav-icon" src="./assets/icons/layout-dashboard.svg" alt="">
            <span class="nav-label">运行中心</span>
          </a>
          <a href="#/profiles" data-route="/profiles">
            <img class="nav-icon" src="./assets/icons/users-group.svg" alt="">
            <span class="nav-label">群成员画像</span>
          </a>
        </nav>

        <div class="sidebar-quick">
          <span>运行状态</span>
          <dl>
            <div><dt>模式</dt><dd id="sidebar-mode">—</dd></div>
            <div><dt>群组</dt><dd id="sidebar-group">—</dd></div>
            <div><dt>数据</dt><dd id="sidebar-sync">等待同步</dd></div>
          </dl>
        </div>
      </aside>

      <header class="topbar">
        <div class="topbar-context">
          <label class="context-card scope-picker" for="group-select">
            <span>当前群组</span>
            <span class="context-row">
              <span class="context-avatar context-avatar-group" aria-hidden="true">群</span>
              <select id="group-select" aria-label="选择群"></select>
            </span>
          </label>
          <div class="context-card persona-context">
            <span>当前人格</span>
            <span class="context-row">
              <span class="context-avatar" aria-hidden="true">G</span>
              <strong id="persona-name">—</strong>
              <span id="config-version" class="version-chip">—</span>
            </span>
          </div>
        </div>

        <div class="runtime-summary" aria-label="运行摘要">
          <div><span>运行模式</span><strong id="runtime-mode">—</strong></div>
          <div><span>近期消息</span><strong id="visible-events">0</strong></div>
          <div><span>处理中</span><strong id="pending-tasks">0</strong></div>
          <span id="connection-state" class="connection-state" aria-live="polite">
            <span class="status-dot" aria-hidden="true"></span>
            正在连接
          </span>
          <button id="theme-toggle" class="icon-button" type="button" aria-label="切换明暗主题">
            <img src="./assets/icons/moon.svg" alt="">
          </button>
        </div>
      </header>

      <main id="main-content" tabindex="-1">
        <header class="workspace-heading">
          <div>
          <p id="workspace-context">此刻 · 当前群组实时消息链路</p>
            <h1 id="workspace-title">运行中心</h1>
          </div>
          <p id="workspace-description">查看每条群消息经过 NapCat、AstrBot 与 Groupmate 后发生了什么。</p>
        </header>
        <div id="error-banner" class="error-banner" role="alert" hidden></div>
        <section id="workspace" class="workspace" aria-live="polite" aria-busy="true">
          <div class="skeleton skeleton-heading"></div>
          <div class="skeleton skeleton-line"></div>
          <div class="skeleton skeleton-line skeleton-short"></div>
        </section>
      </main>

      <aside id="inspector" class="inspector" aria-label="消息链路详情" hidden>
        <header>
          <div><span>当前消息</span><h2 id="inspector-title">完整处理链路</h2></div>
          <button id="close-inspector" class="icon-button" type="button" aria-label="关闭检查器">
            <img src="./assets/icons/x.svg" alt="">
          </button>
        </header>
        <div id="inspector-content"></div>
      </aside>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
