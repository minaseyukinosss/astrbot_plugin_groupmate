<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Groupmate 设置</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow">GROUPMATE</p>
          <h1>群聊伙伴</h1>
          <p class="lede">运行状态与人格部署摘要。详细项在 AstrBot 插件「配置」里改。</p>
        </div>
        <span id="badge" class="badge" data-tone="neutral">读取中</span>
      </header>

      <div id="error" class="notice" hidden></div>

      <section class="card">
        <div class="card-head">
          <h2>运行</h2>
          <button id="refresh" class="btn quiet" type="button">刷新</button>
        </div>
        <dl class="kv" id="runtime-kv">
          <div><dt>状态</dt><dd id="paused-text">—</dd></div>
          <div><dt>已初始化群</dt><dd id="group-count">—</dd></div>
          <div><dt>当前人格</dt><dd id="active-persona">—</dd></div>
          <div><dt>文本模型模式</dt><dd id="provider-mode">—</dd></div>
          <div><dt>图片理解</dt><dd id="vision-status">—</dd></div>
          <div><dt>配置健康</dt><dd id="config-health">—</dd></div>
        </dl>
        <div class="actions">
          <button id="pause" class="btn" type="button">暂停观察</button>
          <button id="resume" class="btn primary" type="button">恢复观察</button>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>部署摘要</h2>
        </div>
        <p class="muted">
          启用群、分人格称呼、初始关系和模型，请到 WebUI
          <strong>插件 → 群聊伙伴 Groupmate → 配置</strong>
          （齿轮）里编辑。当前只注册爱弥斯人格。
        </p>
        <pre id="config-preview" class="preview">加载中…</pre>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
