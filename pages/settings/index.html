<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Groupmate 控制面</title>
    <link rel="stylesheet" href="./styles/tokens.css">
    <link rel="stylesheet" href="./styles/layout.css">
    <link rel="stylesheet" href="./styles/components.css">
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    <div class="app-shell" id="app-shell">
      <aside class="sidebar">
        <div class="brand-block">
          <span class="brand-mark" aria-hidden="true">G</span>
          <div>
            <strong>Groupmate</strong>
            <span>Social Runtime</span>
          </div>
        </div>
        <nav aria-label="主要工作区">
          <a href="#/runtime" data-route="/runtime">运行中心</a>
          <a href="#/persona" data-route="/persona">人格工作室</a>
          <a href="#/people" data-route="/people">人与记忆</a>
          <a href="#/activity" data-route="/activity">活动与任务</a>
          <a href="#/governance" data-route="/governance">治理与评估</a>
        </nav>
        <p class="sidebar-note">所有状态来自版本化 Projection。</p>
      </aside>

      <header class="topbar">
        <div class="scope-controls">
          <label for="group-select">群</label>
          <select id="group-select" aria-label="选择群"></select>
          <span class="scope-divider" aria-hidden="true"></span>
          <span class="meta-label">人格</span>
          <strong id="persona-name">—</strong>
          <span class="meta-label">版本</span>
          <strong id="config-version">—</strong>
        </div>
        <div class="runtime-controls">
          <span id="connection-state" class="connection-state" aria-live="polite">
            <span class="status-dot" aria-hidden="true"></span>
            正在连接
          </span>
          <button id="pause-runtime" class="button button-danger" type="button">
            暂停运行
          </button>
        </div>
      </header>

      <main id="main-content" tabindex="-1">
        <header class="workspace-heading">
          <div>
            <p id="workspace-context">控制面</p>
            <h1 id="workspace-title">运行中心</h1>
          </div>
          <p id="workspace-description">读取实际运行状态、任务和交付健康。</p>
        </header>
        <div id="error-banner" class="error-banner" role="alert" hidden></div>
        <section id="workspace" class="workspace" aria-live="polite" aria-busy="true">
          <div class="skeleton skeleton-heading"></div>
          <div class="skeleton skeleton-line"></div>
          <div class="skeleton skeleton-line skeleton-short"></div>
        </section>
      </main>

      <aside id="inspector" class="inspector" aria-label="详细检查器" hidden>
        <header>
          <h2>检查器</h2>
          <button id="close-inspector" class="icon-button" type="button" aria-label="关闭检查器">×</button>
        </header>
        <div id="inspector-content"></div>
      </aside>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
