[pytest]
pythonpath = .
markers =
    shared: cross-subsystem safety and platform invariants
    social_runtime: Social Runtime v2 domain behavior
    scenarios: multi-message social scenarios
    contracts: worker, capability, projection, and command contracts
    recovery: crashes, duplicates, expiry, partial success, and unknown results
    evaluation: shadow and target-effect evaluation
    page: AstrBot plugin page behavior
